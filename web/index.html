<!doctype html>
<meta charset="utf-8">
<title>Browser viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<style>
/* Tokens: M3 tonal scheme from a cool blue seed. Dark is the default (you watch a browser here), light follows the system. */
:root{
  color-scheme:dark;
  --surface:#0e1014; --surface-low:#16181d; --surface-c:#1b1e23; --surface-high:#24272d; --surface-highest:#2f3238;
  --on-surface:#e3e2e9; --on-variant:#a9acb6; --dim:#7b7f8a;
  --primary:#a8c8ff; --on-primary:#06305f; --secondary-c:#334460; --on-secondary-c:#d6e3ff;
  --ok:#6fdc8c; --warn:#ffb95c; --error:#ffb4ab; --error-c:#5c1a17; --on-error-c:#ffdad6;
  --shadow:0 1px 2px rgb(0 0 0/.35),0 10px 30px -8px rgb(0 0 0/.55);
  --pill-bg:rgb(36 39 45/.86);
  --ease:cubic-bezier(.2,0,0,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --font:Inter,"Inter Variable","Google Sans Flex","Google Sans Text","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --surface:#eceef4; --surface-low:#f6f7fb; --surface-c:#ffffff; --surface-high:#e6e8f0; --surface-highest:#dcdfe8;
  --on-surface:#1a1c21; --on-variant:#454852; --dim:#6c707b;
  --primary:#2f5c9a; --on-primary:#fff; --secondary-c:#d6e3ff; --on-secondary-c:#0f2c55;
  --ok:#1f9d55; --warn:#a15c00; --error:#ba1a1a; --error-c:#ffdad6; --on-error-c:#410002;
  --shadow:0 1px 2px rgb(20 30 60/.12),0 10px 30px -10px rgb(20 30 60/.25);
  --pill-bg:rgb(255 255 255/.9);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);
  background:var(--surface);color:var(--on-surface);
  font:400 14px/1.4 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
svg.i{width:20px;height:20px;flex:none;fill:currentColor}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---- top bar */
#bar{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;min-width:0}
.who{position:relative;display:flex;align-items:center;flex:none;height:40px;border-radius:999px;background:var(--surface-high)}
#st{position:absolute;left:15px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--dim);pointer-events:none;transition:background-color .3s,box-shadow .3s}
#st.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
body[data-conn=wait] #st,body[data-conn=retry] #st{animation:pulse 1.2s ease-in-out infinite}
body[data-conn=retry] #st{background:var(--warn)}
body[data-conn=off] #st,body[data-conn=out] #st,body[data-conn=err] #st{background:var(--error)}
@keyframes pulse{50%{opacity:.35}}
select{font:inherit;color:inherit;background:transparent;border:0;margin:0;cursor:pointer;appearance:none;-webkit-appearance:none;field-sizing:content}
select option{background:var(--surface-high);color:var(--on-surface)}
.who select{height:40px;padding:0 36px 0 34px;border-radius:999px;font-weight:600;max-width:220px;text-overflow:ellipsis}
.who select:empty{width:40px;padding:0}
.who select:empty~.chev{display:none}
svg.chev{position:absolute;right:14px;top:50%;width:14px;height:14px;margin-top:-7px;pointer-events:none;color:var(--on-variant)}

#tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;
  mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
#tabs::-webkit-scrollbar{display:none}
.chip{flex:none;max-width:220px;height:36px;line-height:36px;padding:0 16px;border-radius:999px;cursor:pointer;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--on-variant);font-weight:500;user-select:none;
  transition:background-color .18s var(--ease),color .18s var(--ease),border-radius .25s var(--ease)}
.chip.cur{background:var(--secondary-c);color:var(--on-secondary-c);font-weight:600}
.chip.act::before,.cell.act .cap::before{content:"";display:inline-block;width:7px;height:7px;margin:0 8px 1px 0;border-radius:50%;
  background:var(--ok);vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.chip:active{border-radius:12px}

/* ---- controls (a floating pill on phones) */
#ctl{display:flex;align-items:center;gap:6px;flex:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;padding:0 16px;
  border:0;border-radius:999px;background:var(--surface-high);color:var(--on-surface);font:600 14px/1 var(--font);cursor:pointer;
  white-space:nowrap;user-select:none;-webkit-user-select:none;
  transition:background-color .18s var(--ease),color .18s var(--ease),border-radius .3s var(--spring),transform .12s var(--ease)}
.btn.ic{width:40px;padding:0}
.btn:active{border-radius:12px;transform:scale(.96)}
.btn[aria-pressed=true],#kbd.on,.tog:has(input:checked){background:var(--secondary-c);color:var(--on-secondary-c)}
.tog{padding:0 16px 0 12px}
.tog input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.tog:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.tog .off{display:none}
.tog:not(:has(input:checked)) .on{display:none}
.tog:not(:has(input:checked)) .off{display:block}
#mosaic .one,#mosaic[aria-pressed=true] .many{display:none}
#mosaic[aria-pressed=true] .one{display:block}
.sel{padding:0}
.sel select{height:40px;padding:0 36px 0 42px;border-radius:999px;font-weight:600}
.sel .lead{position:absolute;left:14px;top:50%;margin-top:-10px;pointer-events:none;color:var(--on-variant)}
@media (hover:hover){
  .chip:not(.cur):hover{background:var(--surface-high);color:var(--on-surface)}
  .btn:hover{background:var(--surface-highest)}
  .btn[aria-pressed=true]:hover,#kbd.on:hover,.tog:has(input:checked):hover{background:color-mix(in srgb,var(--secondary-c) 88%,var(--on-secondary-c))}
  .who:hover{background:var(--surface-highest)}
}
/* customizable select where supported, native picker on touch */
@supports (appearance:base-select){@media (pointer:fine){
  .who select,.sel select,.who select::picker(select),.sel select::picker(select){appearance:base-select}
  .who select,.sel select{display:flex;align-items:center}
  .who select::picker-icon,.sel select::picker-icon{display:none}
  .who select::picker(select),.sel select::picker(select){margin-top:6px;padding:6px;border:0;border-radius:18px;min-width:160px;
    background:var(--surface-highest);color:var(--on-surface);box-shadow:var(--shadow)}
  .who select option,.sel select option{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:transparent;font-weight:500}
  .who select option:hover,.sel select option:hover{background:color-mix(in srgb,var(--on-surface) 9%,transparent)}
  .who select option:checked,.sel select option:checked{background:var(--secondary-c);color:var(--on-secondary-c)}
  .who select option::checkmark,.sel select option::checkmark{display:none}
}}

/* ---- address row */
#info{display:flex;align-items:center;gap:10px;height:36px;margin:0 16px 10px;padding:0 16px 0 14px;border-radius:999px;
  background:var(--surface-c);color:var(--on-variant);min-width:0;transition:background-color .25s var(--ease),color .25s var(--ease)}
#info svg.i{width:16px;height:16px;display:none}
#url{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13.5px;letter-spacing:.005em}
#url b{font-weight:500;color:var(--on-surface)}
body[data-conn=on] #info:not([data-scheme]) .web,body[data-conn=on] #info[data-scheme=http] .web,body[data-conn=on] #info[data-scheme=https] .lock,
body[data-conn=wait] .web,body[data-conn=retry] .spin,body[data-conn=off] .off,body[data-conn=out] .out,body[data-conn=err] .err{display:block!important}
body:not([data-conn=on]) #url::first-letter{text-transform:uppercase}
body[data-conn=retry] #info{background:color-mix(in srgb,var(--warn) 14%,var(--surface-c));color:var(--warn)}
body[data-conn=off] #info,body[data-conn=err] #info{background:var(--error-c);color:var(--on-error-c)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

/* ---- stage */
#stage{container-type:size;display:grid;place-items:center;min-height:0;padding:0 16px 16px;overflow:hidden}
#main{--ar:1.6;width:min(100cqw,100cqh * var(--ar));height:auto;max-height:100cqh;display:block;
  border-radius:14px;background:var(--surface-c);box-shadow:var(--shadow);outline:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .3s var(--ease),filter .3s var(--ease)}
body:not([data-conn=on]) #main{opacity:.4;filter:saturate(.3)}
body[data-conn=wait] #main{opacity:1;filter:none;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{background:var(--surface-high)}}
#grid{align-self:stretch;justify-self:stretch;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;
  align-content:start;overflow:auto;scrollbar-width:thin;padding:2px}
.cell{display:flex;flex-direction:column;gap:2px;padding:8px 8px 4px;border-radius:20px;background:var(--surface-c);cursor:pointer;
  transition:background-color .18s var(--ease),transform .25s var(--spring),border-radius .3s var(--spring)}
.cell canvas{width:100%;display:block;aspect-ratio:16/10;object-fit:contain;border-radius:12px;background:var(--surface-low)}
.cell .cap{padding:8px 6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--on-surface)}
.cell:active{border-radius:14px;transform:scale(.985)}
@media (hover:hover){.cell:hover{background:var(--surface-high);transform:translateY(-2px)}}

/* signed out: the message becomes the page */
body[data-conn=out] #main,body[data-conn=out] #ctl,body[data-conn=out] #tabs,body[data-conn=out] .who{visibility:hidden}
body[data-conn=out] #info{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;margin:0;
  width:min(380px,calc(100vw - 48px));height:auto;flex-direction:column;gap:16px;padding:32px 28px 28px;border-radius:28px;
  background:var(--surface-high);color:var(--on-surface);text-align:center;box-shadow:var(--shadow)}
body[data-conn=out] #info svg.out{width:28px;height:28px;padding:14px;box-sizing:content-box;border-radius:50%;
  background:var(--error-c);color:var(--on-error-c)}
body[data-conn=out] #url{white-space:normal;font-size:15px;line-height:1.5;text-wrap:pretty;color:var(--on-variant);flex:none;width:100%}

#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;resize:none;font-size:16px;pointer-events:none}
#pastebox{position:fixed;z-index:6;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:6px;width:min(420px,calc(100vw - 24px));padding:6px;border-radius:999px;background:var(--pill-bg);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
#pastebox[hidden]{display:none}
#pastein{flex:1;min-width:0;height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--surface-high);color:var(--on-surface);font:16px var(--font)}
#pastein:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
#pastego{background:var(--primary);color:var(--on-primary);height:44px}

/* ---- phones: address next to the browser, tabs below, controls in a floating pill */
@media (max-width:700px){
  body{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"who info" "tabs tabs" "stage stage"}
  #bar{display:contents}
  .who{grid-area:who;margin:calc(10px + env(safe-area-inset-top)) 0 0 calc(12px + env(safe-area-inset-left))}
  .who select{max-width:34vw}
  #info{grid-area:info;height:40px;margin:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 8px;padding:0 14px 0 12px}
  #tabs{grid-area:tabs;padding:8px 12px 0;mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
  #stage{grid-area:stage;padding:10px 8px calc(84px + env(safe-area-inset-bottom))}
  #main{border-radius:12px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cell{padding:6px 6px 2px;border-radius:16px}.cell canvas{border-radius:10px}.cell .cap{padding:6px 4px 4px;font-size:13px}
  #ctl{position:fixed;z-index:4;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    gap:4px;padding:6px;border-radius:999px;background:var(--pill-bg);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
  #ctl .btn{height:44px;min-width:44px;background:transparent}
  #ctl .btn.ic,#ctl .tog,#ctl #mosaic{width:44px;padding:0}
  #ctl .tog .lbl,#ctl #mosaic .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  #ctl .sel select{height:44px;padding:0 14px 0 40px}
  #ctl .sel svg.chev{display:none}
  #ctl .btn[aria-pressed=true],#ctl #kbd.on,#ctl .tog:has(input:checked){background:var(--secondary-c)}
  body[data-conn=out] #info{margin:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="bar">
  <div class="who">
    <span id="st" title="connection" role="img" aria-label="connection"></span>
    <select id="inst" title="browser" aria-label="browser"></select>
    <svg class="i chev" aria-hidden="true"><use href="#i-caret"/></svg>
  </div>
  <div id="tabs"></div>
  <div id="ctl">
    <label class="btn tog" title="follow the tab the agent is working on"><input type="checkbox" id="follow" checked><svg class="i" aria-hidden="true"><use href="#i-follow"/></svg><span class="lbl">Follow</span></label>
    <button id="kbd" class="btn ic" title="keyboard" aria-label="keyboard" aria-pressed="false" hidden><svg class="i" aria-hidden="true"><use href="#i-kbd"/></svg></button>
    <button id="paste" class="btn ic" title="paste" aria-label="paste" hidden><svg class="i" aria-hidden="true"><use href="#i-paste"/></svg></button>
    <button id="mosaic" class="btn" title="show all tabs" aria-pressed="false"><svg class="i many" aria-hidden="true"><use href="#i-grid"/></svg><svg class="i one" aria-hidden="true"><use href="#i-window"/></svg><span class="lbl">Mosaic</span></button>
    <span class="btn sel"><svg class="i lead" aria-hidden="true"><use href="#i-gauge"/></svg><select id="q" title="stream quality" aria-label="stream quality">
      <option value="auto">Auto</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option>
    </select><svg class="i chev" aria-hidden="true"><use href="#i-caret"/></svg></span>
    <button id="reload" class="btn ic" title="Reload" aria-label="Reload"><svg class="i" aria-hidden="true"><use href="#i-reload"/></svg></button>
  </div>
</div>
<div id="info" role="status"><svg class="i lock" aria-hidden="true"><use href="#i-lock"/></svg><svg class="i web" aria-hidden="true"><use href="#i-globe"/></svg><svg class="i spin" aria-hidden="true"><use href="#i-notch"/></svg><svg class="i off" aria-hidden="true"><use href="#i-nosignal"/></svg><svg class="i out" aria-hidden="true"><use href="#i-unlink"/></svg><svg class="i err" aria-hidden="true"><use href="#i-warn"/></svg><span id="url"></span></div>
<textarea id="kb" rows="1" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-hidden="true" tabindex="-1"></textarea>
<form id="pastebox" hidden autocomplete="off"><input id="pastein" type="password" aria-label="paste" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button id="pastego" class="btn" type="submit">Send</button></form>
<div id="stage"><canvas id="main" tabindex="0" width="640" height="400"></canvas><div id="grid" hidden></div></div>
<script>
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
// A link carries a one-time ?b= token. It is exchanged for an HttpOnly session cookie and removed from the address bar,
// so no secret is left in the page, in sessionStorage or in the history entry that matters.
const authed = async () => { try { return (await fetch('/api/auth', {cache: 'no-store'})).ok; } catch (e) { return true; } };
async function signIn() {
  const b = P.get('b');
  if (!b) return;
  P.delete('b'); history.replaceState(null, '', location.pathname + (P.toString() ? '?' + P : ''));
  try { await fetch('/api/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({b})}); } catch (e) { /* authed() decides */ }
}
// UI only: the connection state drives the status dot, the address row and the stage (wait, on, retry, off, out, err)
const conn = s => { document.body.dataset.conn = s; $('st').title = $('st').ariaLabel = s === 'on' ? 'connected' : s === 'retry' ? 'reconnecting' : s === 'wait' ? 'connecting' : 'not connected'; };
const signedOut = () => { conn('out'); $('url').textContent = 'not signed in: this link has expired or was already used. Ask for a new one (hermes browser-viewer link).'; };
let INST = P.get('i') || '', ws = null, retry = 0, manual = false;
let tabs = [], active = null, pin = null, mode = 'single', qual = 'auto', autoPin = null, autoTimer = 0;
let idx2tid = {}, cssW = 1280, cssH = 800;
const main = $('main'), mx = main.getContext('2d'), grid = $('grid'), cells = {};

const curTid = () => (pin && tabs.some(t => t.id === pin)) ? pin : active;
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
const sendView = () => send({t: 'view', mode, tab: pin, q: qual});
function touch() {
  if ($('follow').checked && !pin) { const t = curTid(); if (t) { pin = autoPin = t; sendView(); renderTabs(); } }
  clearTimeout(autoTimer);
  if (autoPin) autoTimer = setTimeout(() => {
    if (autoPin && pin === autoPin && $('follow').checked) { pin = autoPin = null; sendView(); renderTabs(); showUrl(); }
  }, 10000);
}
const label = t => (t.title || '').trim() || (() => { try { return new URL(t.url).host } catch (e) { return t.url || 'new tab' } })();

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws` + (INST ? `?i=${encodeURIComponent(INST)}` : ''));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('st').classList.add('on'); conn('on'); retry = 0; sendView(); };
  ws.onclose = () => {
    $('st').classList.remove('on');
    if (manual) { manual = false; connect(); return; }
    if (retry < 20) { retry++; conn('retry'); $('url').textContent = 'reconnecting...'; setTimeout(async () => { if (await authed()) connect(); else signedOut(); }, 1500); }
    else { conn('off'); $('url').textContent = 'disconnected: reload the page'; }
  };
  ws.onmessage = e => (e.data instanceof ArrayBuffer) ? onFrame(e.data) : onMsg(JSON.parse(e.data));
}

function onMsg(m) {
  if (m.t === 'hello') {
    INST = m.instance;
    const s = $('inst'); s.innerHTML = '';
    m.instances.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; s.appendChild(o); });
    s.value = INST;
  } else if (m.t === 'tabs') {
    tabs = m.tabs; active = m.active; idx2tid = {}; conn('on');
    tabs.forEach(t => idx2tid[t.idx] = t.id);
    if (pin && !tabs.some(t => t.id === pin)) { pin = autoPin = null; $('follow').checked = true; sendView(); }
    renderTabs(); renderGrid(); showUrl();
  } else if (m.t === 'err') {
    conn('err'); $('url').textContent = m.u;
    if (m.instances && m.instances.length > 1) INST = '';
  }
}

function renderTabs() {
  const box = $('tabs'); box.innerHTML = '';
  tabs.forEach(t => {
    const d = document.createElement('div');
    d.className = 'chip' + (t.id === curTid() ? ' cur' : '') + (t.id === active ? ' act' : '');
    d.textContent = label(t); d.title = t.url;
    d.onclick = () => { pin = t.id; autoPin = null; $('follow').checked = false; mode = 'single'; sendView(); renderAll(); };
    box.appendChild(d);
  });
}
function showUrl() { const t = tabs.find(x => x.id === curTid()); paintUrl(t ? t.url : ''); }
function paintUrl(u) {     // UI only: the host stands out, the scheme picks the icon
  const el = $('url'), info = $('info'); el.textContent = ''; el.title = u; delete info.dataset.scheme;
  try {
    const x = new URL(u);
    if (x.protocol === 'http:' || x.protocol === 'https:') {
      info.dataset.scheme = x.protocol.slice(0, -1);
      const b = document.createElement('b'); b.textContent = x.host;
      el.append(b, (x.pathname === '/' ? '' : x.pathname) + x.search + x.hash);
      return;
    }
  } catch (e) { /* not a URL: shown as it is */ }
  el.textContent = u;
}
// UI only: the canvas box keeps the picture's shape, so it can grow to the stage without letterboxing
new MutationObserver(() => main.style.setProperty('--ar', main.width / main.height)).observe(main, {attributes: true, attributeFilter: ['width', 'height']});
function renderGrid() {
  if (mode !== 'mosaic') return;
  const want = tabs.slice().reverse().slice(0, 12);
  Object.keys(cells).forEach(id => { if (!want.some(t => t.id === id)) { cells[id].el.remove(); delete cells[id]; } });
  want.forEach(t => {
    let c = cells[t.id];
    if (!c) {
      const el = document.createElement('div'); el.className = 'cell';
      const cv = document.createElement('canvas'); cv.width = 400; cv.height = 300;
      const cap = document.createElement('div'); cap.className = 'cap';
      el.append(cv, cap);
      el.onclick = () => { pin = t.id; autoPin = null; $('follow').checked = false; mode = 'single'; sendView(); renderAll(); };
      grid.appendChild(el); c = cells[t.id] = {el, cv, cap};
    }
    c.cap.textContent = label(t); c.el.classList.toggle('act', t.id === active);
  });
}
function renderAll() {
  main.hidden = mode === 'mosaic'; grid.hidden = mode !== 'mosaic';
  $('mosaic').querySelector('.lbl').textContent = mode === 'mosaic' ? 'Tabs' : 'Mosaic'; $('mosaic').setAttribute('aria-pressed', mode === 'mosaic');
  if (mode === 'mosaic') { Object.values(cells).forEach(c => c.el.remove()); Object.keys(cells).forEach(k => delete cells[k]); }
  renderTabs(); renderGrid(); showUrl();
}

async function onFrame(buf) {
  const dv = new DataView(buf), idx = dv.getUint16(1), w = dv.getUint16(3), h = dv.getUint16(5), fid = dv.getUint16(7);
  const tid = idx2tid[idx];
  try {
    const bmp = await createImageBitmap(new Blob([new Uint8Array(buf, 9)], {type: 'image/jpeg'}));
    if (mode === 'single') {
      if (tid === curTid()) {
        if (main.width !== bmp.width || main.height !== bmp.height) { main.width = bmp.width; main.height = bmp.height; }
        mx.drawImage(bmp, 0, 0); cssW = w; cssH = h;
      }
    } else if (cells[tid]) {
      const cv = cells[tid].cv;
      if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
      cv.getContext('2d').drawImage(bmp, 0, 0);
    }
    bmp.close();
  } catch (e) { /* undecodable frame: still ack so the stream keeps moving */ }
  send({t: 'ack', f: fid});
}

// ---- controls
$('inst').onchange = e => { INST = e.target.value; pin = null; tabs = []; manual = true; ws.close(); };
$('follow').onchange = e => { autoPin = null; if (e.target.checked) { pin = null; sendView(); renderAll(); } else { pin = curTid(); sendView(); } };
$('mosaic').onclick = () => { mode = mode === 'single' ? 'mosaic' : 'single'; sendView(); renderAll(); };
$('q').onchange = e => { qual = e.target.value; sendView(); };
$('reload').onclick = () => send({t: 'reload'});

// ---- input (only on the main canvas, only while a single tab is shown)
// The canvas box can be larger than the picture (object-fit: contain): always map through the rectangle really drawn.
function fit() { const r = main.getBoundingClientRect(), k = Math.min(r.width / main.width, r.height / main.height), w = main.width * k, h = main.height * k; return {x: r.left + (r.width - w) / 2, y: r.top + (r.height - h) / 2, w, h}; }
function at(cx, cy, clamp) {
  const f = fit();
  let x = (cx - f.x) * cssW / f.w, y = (cy - f.y) * cssH / f.h;
  if (clamp) return {x: Math.min(Math.max(x, 0), cssW), y: Math.min(Math.max(y, 0), cssH)};
  return (x < 0 || y < 0 || x > cssW || y > cssH) ? null : {x, y};
}
const pos = (e, clamp) => at(e.clientX, e.clientY, clamp);
const BTN = ['left', 'middle', 'right'], tab = () => curTid();
const isAltGr = e => !!(e.getModifierState && e.getModifierState('AltGraph'));
const mods = e => isAltGr(e) ? 0 : (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
const chord = e => (e.metaKey || e.ctrlKey) && !isAltGr(e);
const mouseMsg = (type, e, p) => ({t: 'mouse', tab: tab(), type, ...p, button: BTN[e.button] || 'left', buttons: e.buttons, mod: mods(e), clickCount: e.detail || 1});
main.addEventListener('mousedown', e => { main.focus({preventScroll: true}); e.preventDefault(); const p = pos(e); if (!p) return; touch(); send(mouseMsg('mousePressed', e, p)); });
main.addEventListener('mouseup', e => { e.preventDefault(); send(mouseMsg('mouseReleased', e, pos(e, true))); });
let lm = 0;
main.addEventListener('mousemove', e => { const n = performance.now(); if (n - lm < 40) return; lm = n; const p = pos(e); if (p) send({t: 'mouse', tab: tab(), type: 'mouseMoved', ...p, buttons: e.buttons, mod: mods(e)}); });
main.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e, true); send({t: 'mouse', tab: tab(), type: 'mouseWheel', ...p, deltaX: e.deltaX, deltaY: e.deltaY}); }, {passive: false});

// ---- touch: a tap clicks, a one-finger drag scrolls the remote page
let tp = null;
main.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  tp = e.touches.length === 1 ? {x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY, moved: false} : null;
}, {passive: false});
main.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!tp || e.touches.length !== 1) { tp = null; return; }
  const t = e.touches[0];
  if (!tp.moved && Math.hypot(t.clientX - tp.x0, t.clientY - tp.y0) < 10) return;
  tp.moved = true;
  const f = fit();
  send({t: 'mouse', tab: tab(), type: 'mouseWheel', ...at(t.clientX, t.clientY, true), deltaX: -(t.clientX - tp.x) * cssW / f.w, deltaY: -(t.clientY - tp.y) * cssH / f.h});
  tp.x = t.clientX; tp.y = t.clientY; touch();
}, {passive: false});
main.addEventListener('touchend', e => {
  e.preventDefault();
  const t = tp; tp = null;
  if (!t || t.moved) return;
  const p = at(t.x0, t.y0);
  if (p) {
    touch();
    send({t: 'mouse', tab: tab(), type: 'mousePressed', ...p, button: 'left', buttons: 1, clickCount: 1});
    send({t: 'mouse', tab: tab(), type: 'mouseReleased', ...p, button: 'left', buttons: 0, clickCount: 1});
  }
  if (kbOn) kb.focus({preventScroll: true});     // inside the gesture, so the soft keyboard stays up
}, {passive: false});
main.addEventListener('touchcancel', () => { tp = null; });
main.addEventListener('contextmenu', e => e.preventDefault());
const SP = {Enter: 13, Backspace: 8, Tab: 9, Escape: 27, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Delete: 46, Home: 36, End: 35, PageUp: 33, PageDown: 34};
const typing = e => mode === 'single' && !['SELECT', 'INPUT', 'BUTTON', 'TEXTAREA'].includes(e.target.tagName);
// ---- soft keyboard (touch devices): a hidden textarea receives what the keyboard types and mirrors it to the page.
// Android keyboards send key 'Unidentified' for letters, so keydown is useless there: the textarea content is diffed instead.
const kb = $('kb'), SENT = '    ';        // sentinel spaces, so Backspace on an empty box still produces an input event
let kbOn = false, composing = false, kbPrev = SENT;
if (matchMedia('(pointer: coarse)').matches) $('kbd').hidden = $('paste').hidden = false;
function kbReset() { kb.value = kbPrev = SENT; kb.setSelectionRange(SENT.length, SENT.length); }
function pressKey(key, vk, code, text) {
  send({t: 'key', tab: tab(), type: 'keyDown', key, code, vk, text: text || ''});
  send({t: 'key', tab: tab(), type: 'keyUp', key, code, vk});
}
function kbSync() {
  const cur = kb.value, m = Math.min(cur.length, kbPrev.length);
  let p = 0;
  while (p < m && cur[p] === kbPrev[p]) p++;
  const del = kbPrev.length - p, ins = cur.slice(p);
  kbPrev = cur; touch();
  for (let i = 0; i < del; i++) pressKey('Backspace', 8, 'Backspace');
  if (ins) send({t: 'text', tab: tab(), text: ins});
  if (!composing && (cur.length > 64 || cur.length < SENT.length)) kbReset();
}
kb.addEventListener('input', kbSync);
kb.addEventListener('compositionstart', () => { composing = true; });
kb.addEventListener('compositionend', () => { composing = false; kbSync(); });
kb.addEventListener('keydown', e => { if (e.key in SP) { e.preventDefault(); touch(); pressKey(e.key, SP[e.key], e.code, e.key === 'Enter' ? '\r' : ''); } });
$('kbd').onclick = () => {
  kbOn = !kbOn; $('kbd').classList.toggle('on', kbOn); $('kbd').setAttribute('aria-pressed', kbOn);
  if (kbOn) { kbReset(); kb.focus({preventScroll: true}); } else kb.blur();
};
document.addEventListener('keydown', e => {
  if (!typing(e)) return;
  touch();
  if (chord(e)) { if (e.key === 'a' || e.key === 'A') { e.preventDefault(); send({t: 'key', tab: tab(), type: 'keyDown', key: 'a', code: 'KeyA', vk: 65, commands: ['selectAll']}); } return; }
  if (e.key in SP) { e.preventDefault(); send({t: 'key', tab: tab(), type: 'keyDown', key: e.key, code: e.code, vk: SP[e.key], mod: mods(e), text: e.key === 'Enter' ? '\r' : ''}); return; }
  if (e.key.length === 1) { e.preventDefault(); send({t: 'key', tab: tab(), type: 'keyDown', key: e.key, code: e.code, vk: e.keyCode, mod: mods(e), text: e.key}); }
});
document.addEventListener('keyup', e => {
  if (!typing(e) || chord(e)) return;
  if (e.key in SP || e.key.length === 1) { e.preventDefault(); send({t: 'key', tab: tab(), type: 'keyUp', key: e.key, code: e.code, vk: SP[e.key] || e.keyCode, mod: mods(e)}); }
});
// ---- paste on phones: the canvas has no long-press menu, so the button reads the clipboard,
// or opens a masked field where the OS paste menu works (iOS WebViews often refuse clipboard.readText).
const pbox = $('pastebox'), pasteIn = $('pastein');
function pasteSend(t) { if (t) { touch(); send({t: 'text', tab: tab(), text: t}); } }
function pasteClose() { pasteIn.value = ''; pbox.hidden = true; $('paste').setAttribute('aria-expanded', 'false'); }
function pasteOpen() { pbox.hidden = false; $('paste').setAttribute('aria-expanded', 'true'); pasteIn.focus(); }
$('paste').onclick = async () => {
  if (!pbox.hidden) { pasteClose(); return; }
  let t = '';
  try { if (navigator.clipboard && navigator.clipboard.readText) t = await navigator.clipboard.readText(); } catch (_) {}
  if (t) pasteSend(t); else pasteOpen();
};
pbox.addEventListener('submit', e => { e.preventDefault(); pasteSend(pasteIn.value); pasteClose(); });
pasteIn.addEventListener('keydown', e => { if (e.key === 'Escape') pasteClose(); });
document.addEventListener('paste', e => {
  if (!typing(e)) return;
  const t = (e.clipboardData || window.clipboardData).getData('text');
  if (t) { e.preventDefault(); touch(); send({t: 'text', tab: tab(), text: t}); }
});
signIn().then(async () => { if (await authed()) connect(); else signedOut(); });
</script>
