name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "aiohttp>=3.9,<4" "psutil>=7,<8"
      - name: browser in use
        run: python -c "import bv_core; print(bv_core._chromium_candidates())" || true
      - run: python -m unittest -v tests.test_viewer
