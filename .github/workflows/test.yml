name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "aiohttp>=3.9,<4" "psutil>=7,<8"
      # Ubuntu 24.04 runners block unprivileged user namespaces through AppArmor, so Chrome's sandbox aborts at start.
      - name: allow Chrome's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: chrome-headless-shell (the default engine of headless browsers)
        run: npx -y @puppeteer/browsers install chrome-headless-shell@stable --path ~/.hermes/tools/chs
      - name: browser in use
        run: python -c "import bv_core; print(bv_core._chromium_candidates(), bv_core.chromium_path(headless=True))"
      - name: tests on chrome-headless-shell
        run: python -m unittest -v tests.test_viewer
        env:
          BV_KEEP_LOGS: ${{ runner.temp }}/bv-logs
          BV_START_TIMEOUT: "45"   # a cold Chromium on a shared runner once took longer than the 15 s default
      - name: tests on the regular Chromium
        run: python -m unittest tests.test_viewer
        env:
          BV_HEADLESS_SHELL: "0"
          BV_KEEP_LOGS: ${{ runner.temp }}/bv-logs
          BV_START_TIMEOUT: "45"   # a cold Chromium on a shared runner once took longer than the 15 s default
      - name: Chromium logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/bv-logs
          if-no-files-found: ignore
